services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: teammemory-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - teammemory_pgdata:/var/lib/postgresql/data
    networks:
      - teammemory-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  teammemory_pgdata:
    name: teammemory_pgdata

networks:
  teammemory-network:
    name: teammemory-network
